<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202723">
  <meta name="description" content="Inserisci una moneta virtuale e accendi un cero alla Madonna.">
  <title>Un cero per Maria</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><h1>un cero per Maria</h1></header>
  <main>
    <div class="votive" id="votive">
      <div class="portrait"><svg class="mary" viewBox="0 0 440 530" role="img" aria-labelledby="mary-title mary-desc">
            <title id="mary-title">La Vergine Maria in preghiera</title>
            <desc id="mary-desc">Illustrazione delicata della Madonna con il velo azzurro, le mani giunte e un'aureola dorata.</desc>
            <defs>
              <linearGradient id="veil" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4b8bb"/><stop offset=".55" stop-color="#7c979f"/><stop offset="1" stop-color="#4e727e"/></linearGradient>
              <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6eee0"/><stop offset="1" stop-color="#d7cabb"/></linearGradient>
              <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecd7c0"/><stop offset="1" stop-color="#cfad92"/></linearGradient>
              <radialGradient id="aura"><stop stop-color="#ebd6a4" stop-opacity=".7"/><stop offset="1" stop-color="#ebd6a4" stop-opacity="0"/></radialGradient>
            </defs>
            <circle cx="220" cy="175" r="136" fill="url(#aura)"/>
            <circle cx="220" cy="169" r="96" fill="none" stroke="#b8a06b" stroke-width="1" opacity=".65"/>
            <circle cx="220" cy="169" r="88" fill="none" stroke="#b8a06b" stroke-width=".6" opacity=".35"/>
            <g fill="#b6a16d" opacity=".8"><path d="m220 56 2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><circle cx="133" cy="99" r="2"/><circle cx="308" cy="99" r="2"/><circle cx="111" cy="173" r="2"/><circle cx="330" cy="173" r="2"/></g>
            <path d="M219 101C163 101 145 154 139 204c-8 62-40 151-54 241l39 53h193l39-53c-18-87-42-177-52-242-8-55-27-102-85-102Z" fill="url(#veil)"/>
            <path d="M219 122c-35 4-58 38-57 80l12 48-22 53-25 195h188l-25-195-25-53 10-52c1-45-19-75-56-76Z" fill="url(#robe)"/>
            <path d="M208 218h26l7 45-22 28-21-28Z" fill="url(#skin)"/>
            <path d="M178 168c0-32 17-48 41-48 29 0 47 25 44 56l-8 39c-8 24-23 38-36 38-14 0-30-15-37-40Z" fill="url(#skin)"/>
            <path d="M172 185c1-28 5-50 22-61 16-14 42-12 58 6 10 13 16 29 16 55l12 19c1-67-18-94-59-95-40 0-62 37-62 95Z" fill="#f5ecdb"/>
            <path d="M187 190q10 8 21 1m23 0q10 7 20-2" fill="none" stroke="#8c7364" stroke-width="1.5" stroke-linecap="round"/>
            <path d="m219 193-4 20 8 2m-14 14q10 5 19-1" fill="none" stroke="#a78470" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M172 139c-10 51-13 101-4 143-29 63-42 127-44 216H85c18-92 50-190 54-250 4-52 10-85 33-109Z" fill="#79959c"/>
            <path d="M268 139c15 47 11 103 1 143 33 64 45 130 47 216h40c-18-92-49-190-54-250-4-52-11-85-34-109Z" fill="#658792"/>
            <path d="M163 287c-16 60-29 125-28 183m139-184c17 63 28 123 28 183" fill="none" stroke="#c7d0c9" stroke-width="1" opacity=".5"/>
            <path d="m155 358 40-39 13 32-46 55c-14 9-25 2-28-11Z" fill="url(#robe)"/>
            <path d="m284 358-40-39-13 32 46 55c14 9 25 2 28-11Z" fill="url(#robe)"/>
            <path d="M199 351c1-21 5-43 13-61 3-8 7-17 10-16 5 2 1 16 0 24l-2 33-8 28Z" fill="url(#skin)"/>
            <path d="M241 351c-1-21-5-43-13-61-3-8-7-17-10-16-5 2-1 16 0 24l2 33 8 28Z" fill="url(#skin)"/>
            <path d="m220 293-1 49m-9-39-5 34m24-34 5 34" fill="none" stroke="#b8957d" stroke-width="1"/>
            <path d="M177 387q42 24 87 0m-81 32q38 15 74 0" fill="none" stroke="#bdae99" opacity=".35"/>
          </svg></div>
      <div class="candle-scene" id="candle-scene" role="img" aria-label="Un cero spento">
        <div class="light-halo"></div>
        <div class="flame"><span></span></div>
        <div class="wick"></div>
        <div class="candle"><div class="wax-top"></div><div class="wax-pool"></div><div class="wax-drip one"></div><div class="wax-drip two"></div></div>
        <div class="holder"></div>
      </div>
      <div class="offering-box" aria-hidden="true"><div class="slot-surround"><div class="slot"></div></div></div>
      <div class="coin-path" aria-hidden="true"><span class="flying-coin">1<span>€</span></span></div>
      <button id="coin-button" type="button" aria-label="Inserisci una moneta virtuale e accendi un cero"><span class="coin" aria-hidden="true">1<span>€</span></span><span class="button-label">Inserisci una moneta</span></button>
      <div class="daily-status" id="daily-status" hidden><p>Il tuo cero è acceso.</p><button id="extinguish-button" type="button">Spegni</button></div>
    </div>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <p id="storage-note" hidden>Questo browser non permette di ricordare l’accensione dopo la chiusura della pagina.</p>
    <noscript>Attiva JavaScript per accendere il cero.</noscript>
  </main>
</body>
</html>
